# logical parts
fragmentKtxVersion = "1.8.8"
glide = "4.16.0" # image loader
javafaker = "1.0.2" # test data
# DI
hilt = "2.56.2"
ksp = "2.1.20-1.0.31"
# Network
gson = "2.13.2"
okhttp = "5.2.1"
